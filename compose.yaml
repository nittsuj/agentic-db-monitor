services:
  app:
    build: .
    depends_on:
      mysql:
        condition: service_healthy
    ports:
      # Local single-user app: keep it off every network interface.
      - "127.0.0.1:8000:8000"
    environment:
      APP_ENV: production
      APP_DEBUG: "false"
      APP_URL: http://localhost:8000
      APP_KEY: ${APP_KEY:-}
      DB_CONNECTION: mysql
      DB_HOST: mysql
      DB_PORT: "3306"
      DB_DATABASE: agentic_db_monitor
      DB_USERNAME: adbm
      DB_PASSWORD: ${DB_PASSWORD:-adbm-secret}
      # Pinned bastion host keys must survive rebuilds.
      ADBM_SSH_STATE_DIR: /data/ssh
      SESSION_DRIVER: database
      CACHE_STORE: database
      QUEUE_CONNECTION: sync
      LOG_CHANNEL: stderr
      PHP_CLI_SERVER_WORKERS: "4"
      TARGET_DB_HOST: ${TARGET_DB_HOST:-host.docker.internal}
      SEED_DEMO: ${SEED_DEMO:-false}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - app-data:/data
      # The DBPA CSV files are not baked into the image; mount them read-only so
      # `php artisan dbpa:import --path=/dbpa/csv` can load the replay data.
      - ./database/dbpa/csv:/dbpa/csv:ro

  # The app's own database: users, chats, projects and their logs.
  mysql:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: agentic_db_monitor
      MYSQL_USER: adbm
      MYSQL_PASSWORD: ${DB_PASSWORD:-adbm-secret}
      MYSQL_RANDOM_ROOT_PASSWORD: "yes"
    ports:
      # Local only, so the chat tables can be inspected from a MySQL client.
      - "127.0.0.1:3307:3306"
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -u adbm -p\"$$MYSQL_PASSWORD\" --silent"]
      interval: 5s
      timeout: 5s
      retries: 20

volumes:
  app-data:
  mysql-data:
